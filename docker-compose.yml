version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: cruce_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: cruce_arba_agip
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb_data:/data/db
    networks:
      - cruce_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cruce_backend
    restart: unless-stopped
    environment:
      - MONGODB_URL=mongodb://admin:password123@mongodb:27017/cruce_arba_agip?authSource=admin
      - DEBUG=False
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      - mongodb
    networks:
      - cruce_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cruce_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - cruce_network

  nginx:
    image: nginx:alpine
    container_name: cruce_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - cruce_network

networks:
  cruce_network:
    driver: bridge

volumes:
  mongodb_data: